version: "3"

volumes:
  content_server_storage: {}
  nginx_storage: {}
  shared_keys:

services:
  postgres:
    # Updated from postgres:12 (EOL Nov 2024) to postgres:16 for security patches and performance improvements
    # Pinned by digest to the latest postgres:16 at pin time (2026-05-27) for reproducible deploys
    image: postgres:16@sha256:4b7183ac05f8ef417db21fd72d71047a4238340c261d3cc3ddb6d579ab5071ae
    container_name: ${POSTGRES_HOST:-postgres}
    env_file:
      - .env-database-admin
      - .env-database-content
    expose:
      - ${POSTGRES_PORT:-5432}
    restart: always
    shm_size: 2560MB
    volumes:
      - "${CONTENT_SERVER_STORAGE}/database:/var/lib/postgresql/data"
      - "./local/postgres/custom-entrypoint.sh:/usr/local/bin/custom-entrypoint.sh:ro"
      - "./local/postgres/postgresql.conf:/etc/postgresql/postgresql.conf"
      - "./local/postgres/scripts/always:/always-initdb.d:ro"
      - "./local/postgres/scripts/initial:/docker-entrypoint-initdb.d:ro"
    command: custom-entrypoint.sh -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: syslog
      options: { tag: postgres }

  postgres-exporter:
    # Pinned to v0.20.1 by digest (was floating :latest)
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    container_name: postgres-exporter
    environment:
      - PG_EXPORTER_EXTEND_QUERY_PATH=/etc/postgres-exporter/queries.yaml
    env_file:
      - .env-database-metrics
    volumes:
      - ./local/postgres-exporter:/etc/postgres-exporter
    restart: always
    depends_on:
      - postgres
    shm_size: 512mb
    logging:
      driver: syslog
      options: { tag: postgres-exporter }

  node-exporter:
    # Pinned to v1.12.1 by digest (was floating :latest)
    image: quay.io/prometheus/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - "/:/rootfs:ro"
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.rootfs=/rootfs"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)"
    logging:
      driver: syslog
      options: { tag: node-exporter }

  content-server:
    image: quay.io/decentraland/catalyst:${DOCKER_TAG:-latest}
    command:
      [
        "/usr/local/bin/node",
        "--max-old-space-size=8192",
        "content/entrypoints/run-server.js",
      ]
    working_dir: /app
    environment:
      - LOG_REQUESTS=false # Request logs are produced by NGINX
      - CONTENT_SERVER_ADDRESS=${CATALYST_URL}/content/
      - STORAGE_ROOT_FOLDER=/app/storage/content_server/
      - BOOTSTRAP_FROM_SCRATCH=${BOOTSTRAP_FROM_SCRATCH:-false}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
    env_file:
      - .env
      - .env-advanced
      - .env-database-content
    depends_on:
      - postgres
    expose:
      - "6969"
    restart: always
    volumes:
      - "${CONTENT_SERVER_STORAGE}:/app/storage/content_server/"
    logging:
      driver: syslog
      options: { tag: content-server }

  lamb2:
    image: quay.io/decentraland/lamb2:${LAMB2_DOCKER_TAG:-latest}
    working_dir: /app
    restart: always
    environment:
      - HTTP_SERVER_PORT=7272
      - LAMBDAS_URL=${CATALYST_URL}/lambdas/
      - CONTENT_URL=${CATALYST_URL}/content/
      - INTERNAL_LAMBDAS_URL=http://lamb2:7272
      - INTERNAL_CONTENT_URL=http://content-server:6969
      - REALM_NAME=${REALM_NAME}
      - MAX_USERS=${MAX_USERS:-400}
      - DISABLE_THIRD_PARTY_PROVIDERS_RESOLVER_SERVICE_USAGE=${DISABLE_THIRD_PARTY_PROVIDERS_RESOLVER_SERVICE_USAGE:-false}
    env_file:
      - .env
      - .env-advanced
    expose:
      - "7272"
    logging:
      driver: syslog
      options: { tag: lamb2 }

  cadvisor:
    # Pinned by digest to the v0.55.1 release for reproducible deploys
    image: gcr.io/cadvisor/cadvisor:v0.55.1@sha256:3de2bd5203120b866d74a9b283b2ffb8ec382fbf9dc321814700c6ea6f44ec57
    container_name: cadvisor
    command: --docker_only=true --disable_root_cgroup_stats=true
    restart: always
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    depends_on:
      - content-server

  nginx:
    container_name: nginx
    # Pinned by digest to guarantee the patched binary
    # (>= 1.31.1 fixes CVE-2026-9256, a heap overflow in ngx_http_rewrite_module)
    image: nginx:1.31.3-alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
    ports:
      - "80:80"
      - "443:443"
    command: '/bin/sh -c ''while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g "daemon off;"'''
    volumes:
      - ./local/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./local/nginx/conf.d:/etc/nginx/conf.d
      - ./local/nginx/include:/etc/nginx/include
      - ./local/nginx/auth:/etc/nginx/auth
      - ./local/nginx/html:/etc/nginx/html
      - ./local/certbot/conf:/etc/letsencrypt
      - ./local/certbot/www:/var/www/certbot
      - shared_keys:/secrets
    restart: always
    depends_on:
      - lamb2
      - cadvisor
      - content-server
      - postgres-exporter
      - node-exporter
      - certbot
    logging:
      driver: syslog
      options: { tag: nginx }

  certbot:
    # Pinned to v5.7.0 by digest (was floating :latest)
    image: certbot/certbot:v5.7.0@sha256:34ee91d2f43008eb78a007d22f23ed4b2eaa9a454cb27ca2c042b49527a695b4
    restart: always
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    volumes:
      - ./local/certbot/conf:/etc/letsencrypt
      - ./local/certbot/www:/var/www/certbot
    logging:
      driver: syslog
      options: { tag: certbot }
